[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-level"
version = "1.0.0"
description = "Agent Level: measure AI engineering workflow autonomy from local evidence"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-agents", "claude-code", "codex", "evaluation", "software-engineering"]

[project.urls]
Repository = "https://github.com/fwhalbert/agent_level"
Documentation = "https://github.com/fwhalbert/agent_level#readme"
Issues = "https://github.com/fwhalbert/agent_level/issues"

[project.scripts]
agent-level = "assessment.cli:main"
agent-level-assess = "assess:project_cli"
"agent_level_assess.py" = "assess:project_cli"
agent-level-record = "agent_level_record:main"
agent-level-session-notice = "auto_eval_session_notice:main"

[tool.setuptools]
packages = ["assessment"]
py-modules = ["assess", "agent_level_record", "auto_eval_session_notice", "bootstrap"]

[tool.setuptools.package-data]
assessment = ["task_evidence.md"]
