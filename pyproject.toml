[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-assessment"
version = "2.4.0"
description = "Local Claude Code and Codex workflow and task evidence assessment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-level-assess = "assess:project_cli"
"agent_level_assess.py" = "assess:project_cli"
agent-level-record = "agent_level_record:main"
agent-level-session-notice = "auto_eval_session_notice:main"

[tool.setuptools]
packages = ["assessment"]
py-modules = ["assess", "agent_level_record", "auto_eval_session_notice"]
