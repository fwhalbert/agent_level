name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Prepare offline installation smoke test
        run: python -m pip download --dest "$RUNNER_TEMP/wheels" 'setuptools>=64' wheel
      - name: Run all tests including isolated installation
        env:
          AGENT_LEVEL_TEST_WHEELHOUSE: ${{ runner.temp }}/wheels
        run: python -m unittest discover -v
